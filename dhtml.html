<html>
<head>
<title>DHTML Demo</title>
<style>
#box{
width:100px;
height:100px;
background-color:lightblue;
position:relative;
}
</style>
<script>
function moveBox()
{
const box=document.getElementsById('box');
let pos=0;
const id=setInterval(()=>{
if (pos>=300) 
{
clearInterval(id);
}
else
{
pos++;
box.style.left=pos+'px';
}
},5);
}
function changeColor()
{
const box=document.getElementById('box');
box.style.backgroundColor=box.style.backgroundColor === 'lightblue'
?'lightgreen':'lightblue';
}
</script>
</head>
<body>
<h2>DHTML Features</h2>
<button onclick="moveBox()">Move the Box</button>
<button onclick="changeColor()">Change Color</button>
<div id="box"></div>
<p> <a href="index.html">Back to Home</a></p>
</body>
</html>
