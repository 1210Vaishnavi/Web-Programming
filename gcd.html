<html>
<head>
<title>GCD FINDER</title>
<style>
body{
font-family:Arial,sans-serif;
margin:50px;
}
input,button{
padding:10px;
font-size:16px;
margin:5px 0;
}
#result{
margin-top:15px;
font-weight:bold;
}
</style>
</head>
<body>
<h2>Find GCD of Two Numbers</h2>
<label for="num1">Enter first number:</label><br>
<input type="number" id="num1"></br>
<label for="num2">Enter second number:</label><br>
<input type="number" id="num2"><br>
<button onclick="findGCD()">Find GCD</button> 
<div id="result"></div>
<script>
function gcd(a,b)
{
if(b===0)
return a;
return gcd(b,a%b);
}
function findGCD()
{
const num1=parseInt(document.getElementById("num1").value);
const num2=parseInt(document.getElementById("num2").value);
if(isNaN(num1)||isNaN(num2))
{
document.getElementById("result").textContent="PLease enter valid numbers.";
return;
}
const result = gcd(Math.abs(num1), Math.abs(num2)); 
document.getElementById("result").textContent = `GCD of ${num1} and ${num2} is ${result}`; 
}
</script>
</body>
</html>
