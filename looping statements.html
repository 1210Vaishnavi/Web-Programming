<html>
<head>
<meta charset="UTF-8">
<title>Fibonacci Series Generator</title>
<style>
body{
font-family:Arial,sans-serif;
padding:20px;
}
input,button{
padding:8px;
font-size:16px;
}
#result{
margin-top:20px;
font-weight:bold;
}
</style>
</head>
<h2>Generate Fibonacci Series</h2>
<label for="count">Enter N(number of terms):</label>
<input type="number"id="count"min="1"required>
<button onclick="generateFibonacci()">Generate</button>
<div id="result"></div>
<script>
function generateFibonacci()
{
const n=parseInt(document.getElementById("count").value);
const resultDiv=document.getElementById("result");
if(isNaN(n) || n<=0)
{
resultDiv.textContent="Please enter a valid positive number.";
return;
}
let fib=[0,1];
for(let i=2;i<n;i++)
{
fib[i]=fib[i-1]+fib[i-2];
}
const series=n===1?[0]:fib.slice(0,n);
resultDiv.textContent="Fibonacci series:"+series.join(",");
}
</script>
</body>
</html>
